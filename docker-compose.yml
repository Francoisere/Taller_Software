version: '3.8'

services:
  audit-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_privacy_audit_scanner
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres_pass@db:5432/privacy_audit
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: data_privacy_audit_db
    environment:
      - POSTGRES_DB=privacy_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
